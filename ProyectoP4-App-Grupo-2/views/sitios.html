<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CRUD de Sitios</title>

    <link rel="stylesheet"
          href="/css/estilos.css">

</head>

<body class="con-menu">

    <div class="contenedor ancho vista-mongo">

        <h1>CRUD DE SITIOS</h1>
        <h2>Grupo 2 - Turismo y lugares por visitar</h2>
        <hr>

        <div class="formulario">

            <label>ID (ObjectId de MongoDB)</label>

            <input
                type="text"
                id="id">

            <label>Código</label>

            <input
                type="text"
                id="codigo">

            <label>Nombre</label>

            <input
                type="text"
                id="nombre">

            <label>País</label>

            <input
                type="text"
                id="pais">

            <label>Provincia</label>

            <input
                type="text"
                id="provincia">

            <label>Cantón</label>

            <input
                type="text"
                id="canton">

            <label>Categoría</label>

            <input
                type="text"
                id="categoria">

            <label>Descripción</label>

            <input
                type="text"
                id="descripcion">

            <label>Latitud</label>

            <input
                type="number"
                step="any"
                id="latitud">

            <label>Longitud</label>

            <input
                type="number"
                step="any"
                id="longitud">

            <label>Altitud (msnm)</label>

            <input
                type="number"
                step="any"
                id="altitud_msnm">

            <label>Costo de entrada</label>

            <input
                type="number"
                step="any"
                id="costo_entrada">

            <label>Moneda</label>

            <input
                type="text"
                id="moneda">

            <label>Horario</label>

            <input
                type="text"
                id="horario">

            <label>Calificación</label>

            <input
                type="number"
                step="any"
                id="calificacion">

            <label>Imagen</label>

            <div>

                <input
                    type="file"
                    accept="image/*"
                    id="imagen">

                <img id="imagen_vista" class="miniatura">

            </div>

        </div>

        <section class="seccion mongo">

            <h2>Sitios registrados</h2>

            <div class="botones">

            <button id="btnCrear">CREAR</button>

            <button id="btnConsultar">CONSULTAR</button>

            <button id="btnActualizar">ACTUALIZAR</button>

            <button id="btnEliminar">ELIMINAR</button>

            <button id="btnMostrar">MOSTRAR TODOS</button>

            <button id="btnLimpiar">LIMPIAR</button>

            </div>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Código</th>

                        <th>Nombre</th>

                        <th>Provincia</th>

                        <th>Categoría</th>

                        <th>Calificación</th>

                    </tr>

                </thead>

                <tbody id="tablaSitios">

                </tbody>

            </table>

            <br>

        </section>

        <div id="mensaje"></div>

    </div>

    <script src="/js/menu.js"></script>

    <script src="/js/sitios.js"></script>

</body>

</html>
